name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm zip
      - run: pnpm audit:source
      - uses: actions/upload-artifact@v4
        with:
          name: tab-flow-map-packages
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version and notes
        run: |
          node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
          test -f "docs/releases/$GITHUB_REF_NAME.md"
      - uses: actions/download-artifact@v4
        with:
          name: tab-flow-map-packages
          path: .output
      - name: Generate checksums
        working-directory: .output
        run: sha256sum *.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" .output/*.zip .output/SHA256SUMS.txt \
            --verify-tag --title "Tab Flow Map $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
