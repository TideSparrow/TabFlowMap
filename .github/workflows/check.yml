name: Check and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm zip
      - run: pnpm audit:source
      - uses: actions/upload-artifact@v4
        with:
          name: tab-flow-map-packages
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14
